<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <title>QueenBee's Panel</title>
    <style>
      /* Shown only in the moment before the deployed panel answers. The fill is the owner's own
         lavender with ink on it (9.3:1), the same pair the panel uses, so there is no flash of a
         second identity. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: #fdfbff;
        color: #1b1b1f;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .mark {
        display: grid;
        gap: 0.75rem;
        justify-items: center;
        text-align: center;
        padding: 2rem;
      }
      .dot {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #c8b6ff;
      }
      p {
        margin: 0;
        font-size: 15px;
      }
      .muted {
        color: #5b5b66;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <div class="dot"></div>
      <p>Opening the panel…</p>
      <p class="muted">If this stays on screen, the panel could not be reached.</p>
    </div>
  </body>
</html>
